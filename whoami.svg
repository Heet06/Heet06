<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .outer { fill: #1a1b26; }
      .pane { fill: #282c34; }
      .border { fill: none; stroke: #7aa2f7; stroke-width: 2; }
      .ws { fill: #565f6e; font-size: 22px; }
      .ws-active { fill: #c0caf5; font-size: 22px; }
      .clock { fill: #a9b1d6; font-size: 22px; }
      .tilde { fill: #565f6e; font-size: 24px; }
      .prompt { fill: #dcdfe4; font-size: 24px; }
      .cmd { fill: #b5bd68; font-size: 24px; }
      .flag { fill: #6b9fd8; font-size: 24px; }
      .out { fill: #dcdfe4; font-size: 24px; }
      .dim-out { fill: #7f848e; font-size: 24px; }
      .accent-out { fill: #56b6c2; font-size: 24px; }
      .link-out { fill: #61afef; font-size: 24px; }
      .time { fill: #6b7280; font-size: 22px; }
      .cursor { fill: #dcdfe4; }
    </style>
  </defs>

  <!-- outer window bg -->
  <rect class="outer" width="1920" height="1080"/>

  <!-- top status bar -->
  <rect class="outer" x="0" y="0" width="1920" height="45"/>

  <!-- Omarchy logo (actual mark, scaled from 1200x1200 viewBox) -->
  <g transform="translate(27,10) scale(0.0183)">
    <path clip-rule="evenodd" fill-rule="evenodd" fill="#a9b1d6" d="m1200 1200h-480v-80h400v-1040h-479.996v160h-400v720h720v-720h-80v-80h159.996v880h-400v160h-640v-1200h1200zm-1120-80h480v-80h-400l.004-400h-80.004zm0-560h80.004v-400h400v-80h-480.004z"/>
  </g>


  <text x="66" y="29" class="ws-active">1</text>
  <text x="101" y="29" class="ws">2</text>
  <text x="136" y="29" class="ws">3</text>
  <rect x="168" y="13" width="16" height="16" rx="3" fill="#565f6e"/>
  <text x="208" y="29" class="ws">5</text>

  <text x="955" y="29" class="clock" text-anchor="middle">Friday 14:05</text>
  <g transform="translate(1049,11)" fill="none" stroke="#8f97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 9 a4 4 0 0 1 1 -7.9 a5.5 5.5 0 0 1 10.6 1.4 a4 4 0 0 1 -0.6 7.5 h-9 a3.5 3.5 0 0 1 -2 -1 z"/>
    <path d="M6 13.5 l-1.3 2.3 M9.5 13.5 l-1.3 2.3 M13 13.5 l-1.3 2.3" stroke-width="1.3"/>
  </g>

  <!-- right icon tray: back-arrow, wifi, volume, monitor, battery -->
  <g transform="translate(1710,14)">
    <!-- back arrow -->
    <path d="M8 0 L0 9 L8 18" fill="none" stroke="#a9b1d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- wifi: solid filled triangle wedge -->
    <g transform="translate(40,4)" fill="#a9b1d6">
      <path d="M11 15.5 L2 5.8 C 4.6 3.3 7.6 2 11 2 C 14.4 2 17.4 3.3 20 5.8 Z"/>
    </g>

    <!-- volume: solid speaker + 3 waves -->
    <g transform="translate(70,1)" fill="none" stroke="#a9b1d6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 6 H4 L10 1 V17 L4 12 H0 Z" fill="#a9b1d6" stroke="none"/>
      <path d="M14.5 2.5 a12 12 0 0 1 0 13"/>
      <path d="M12.5 5.3 a7.8 7.8 0 0 1 0 7.4"/>
      <path d="M10.7 7.8 a4 4 0 0 1 0 2.4"/>
    </g>

    <!-- monitor: rectangle with small triangular stand -->
    <g transform="translate(108,3)" fill="none" stroke="#a9b1d6" stroke-width="1.8" stroke-linejoin="round">
      <rect x="0" y="0" width="20" height="14" rx="2"/>
      <path d="M7 17 L10 14 L13 17 Z" fill="#a9b1d6" stroke="none"/>
    </g>

    <!-- battery: simple solid rounded rect with nub -->
    <g transform="translate(144,2)">
      <rect x="0" y="2" width="14" height="17" rx="2.5" fill="none" stroke="#a9b1d6" stroke-width="1.8"/>
      <rect x="4.5" y="0" width="5" height="3" rx="1" fill="#a9b1d6"/>
      <rect x="2.2" y="4.2" width="9.6" height="12.6" rx="1" fill="#a9b1d6"/>
    </g>
  </g>

  <!-- terminal pane -->
  <rect class="pane" x="3" y="47" width="1914" height="1030"/>
  <rect class="border" x="4" y="48" width="1912" height="1028"/>

  <!-- ===================== terminal content ===================== -->
  <g transform="translate(38,80)">

    <!-- block 1: intro whoami-style -->
    <text x="0" y="0" class="tilde">~</text>
    <text x="0" y="30"><tspan class="prompt">❯ </tspan><tspan class="cmd">whoami</tspan><tspan class="flag"> --full-name</tspan></text>
    <text x="0" y="56" class="out">Heet Radadiya</text>
    <text x="0" y="82" class="dim-out">System Software Engineer · scalable backends · networking · autonomous robotics</text>
    <text x="1844" y="30" class="time" text-anchor="end">/0.412s</text>

    <text x="0" y="122" class="tilde">~</text>

    <!-- block 2: focus -->
    <text x="0" y="152"><tspan class="prompt">❯ </tspan><tspan class="cmd">focus</tspan><tspan class="flag"> --area</tspan><tspan class="out"> "System Software"</tspan></text>
    <text x="0" y="178" class="dim-out">&gt; loading modules...</text>
    <text x="0" y="204" class="accent-out">[✓] system-software   [✓] computer-networks   [✓] operating-systems</text>

    <text x="0" y="244" class="tilde">~</text>

    <!-- block 3: introduction -->
    <text x="0" y="274"><tspan class="prompt">❯ </tspan><tspan class="cmd">cat</tspan><tspan class="flag"> introduction.txt</tspan></text>
    <text x="0" y="300" class="out">- Climbing a very long ladder learning along the way</text>
    <text x="0" y="326" class="out">- I am in love with exploring, building and talking tech</text>
    <text x="0" y="352" class="out">- Always ready to explore under the abstraction layers</text>

    <text x="0" y="392" class="tilde">~</text>

    <!-- block 4: totem -->
    <text x="0" y="422"><tspan class="prompt">❯ </tspan><tspan class="cmd">cat</tspan><tspan class="flag"> totem.conf</tspan></text>
    <text x="0" y="448" class="out">traits = [responsible, curious, loyal, fast]</text>
    <text x="0" y="474" class="out">relate_to = "Fox 🦊"</text>

    <text x="0" y="514" class="tilde">~</text>

    <!-- block 5: git log streak -->
    <text x="0" y="544"><tspan class="prompt">❯ </tspan><tspan class="cmd">git log</tspan><tspan class="flag"> --streak</tspan><tspan class="flag"> --user</tspan><tspan class="out"> Heet06</tspan></text>
    <text x="0" y="570" class="dim-out">fetching contribution graph...</text>
    <text x="0" y="606" class="out">total contributions</text><text x="370" y="606" class="out">128</text>
    <text x="0" y="632" class="out">current streak</text><text x="370" y="632" class="out">21 days</text>
    <text x="0" y="658" class="out">longest streak</text><text x="370" y="658" class="out">37 days</text>
    <text x="0" y="692" class="link-out">github.com/Heet06</text>

    <text x="0" y="732" class="tilde">~</text>

    <!-- block 6: netstat -->
    <text x="0" y="762"><tspan class="prompt">❯ </tspan><tspan class="cmd">netstat</tspan><tspan class="flag"> --establish</tspan></text>
    <text x="0" y="792" class="dim-out">Proto</text><text x="90" y="792" class="dim-out">Local</text><text x="230" y="792" class="dim-out">Foreign</text><text x="780" y="792" class="dim-out">State</text>
    <text x="0" y="820" class="out">tcp</text><text x="90" y="820" class="out">:443 HTTPS</text><text x="230" y="820" class="link-out">github.com/Heet06</text><text x="780" y="820" class="accent-out">ESTABLISHED</text>
    <text x="0" y="848" class="out">tcp</text><text x="90" y="848" class="out">:443 HTTPS</text><text x="230" y="848" class="link-out">linkedin.com/in/heet-radadiya</text><text x="780" y="848" class="accent-out">ESTABLISHED</text>
    <text x="0" y="876" class="out">tcp</text><text x="90" y="876" class="out">:80  HTTP</text><text x="230" y="876" class="link-out">heet06.is-a.dev</text><text x="780" y="876" class="accent-out">ESTABLISHED</text>

    <text x="0" y="916" class="tilde">~</text>
    <text x="0" y="946" class="prompt">❯ <tspan class="cursor">▊</tspan></text>

  </g>
</svg>
