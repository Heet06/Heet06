name: Update GitHub Terminal Stats

on:
  schedule:
    # Daily. GitHub recommends scheduling at non-round minutes to reduce load.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update terminal stats from GitHub GraphQL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Heet06
          SVG_PATH: whoami.svg
        run: python3 scripts/update-github-stats.py

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add whoami.svg

          if git diff --cached --quiet; then
            echo "No stats changes."
            exit 0
          fi

          git commit -m "chore: update GitHub terminal stats"
          git push
